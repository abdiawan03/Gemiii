<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        #input-container {
            display: flex;
            padding: 12px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }
        textarea {
            flex: 1;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            padding: 10px;
            border-radius: 8px;
            resize: none;
            height: 45px;
            font-size: 15px;
            outline: none;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 8px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <header>✨ AI Personal Assistant</header>
    <div id="chat-container">
        <div class="message ai-message">Hello! Main aapka personal AI assistant hoon. Aaj main aapki kya madad kar sakta hoon?</div>
    </div>
    <div id="input-container">
        <textarea id="userInput" placeholder="Yahan apna message likhein..." rows="1"></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>
    <script>
        let chatHistory = [];
        // Aapki AQ wali API Key yahan set hai
        const apiKey = 'AQ.Ab8RN6K8w-Mc5Sk5j9442BsXeJ61faaDe11Agcq1hmZ8abDW8g'; 
        
        // Assistant ka Role aur Personality Instructions
        const systemPrompt = `You are an advanced, friendly, and intelligent AI personal assistant powered by Gemini, similar to Siri. Your primary role is to engage in natural, smooth, and helpful conversations with the user—just like a human chat partner. You understand context, give thoughtful responses, and maintain an engaging dialogue. Help with video/content planning, scripting, task tracking, and creative prompting. Maintain a professional yet friendly, helpful, and concise tone.`;
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatContainer = document.getElementById('chat-container');
            const userText = inputField.value.trim();
            if (!userText) return;
            appendMessage(userText, 'user-message');
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;
            chatHistory.push({ role: "user", parts: [{ text: userText }] });
            const loadingId = appendMessage("Thinking...", 'ai-message');
            chatContainer.scrollTop = chatContainer.scrollHeight;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        contents: chatHistory
                    })
                });
                const data = await response.json();
                document.getElementById(loadingId).remove();
                if (data.candidates && data.candidates[0].content) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    appendMessage(aiResponse, 'ai-message');
                    chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });
                } else {
                    appendMessage("Error: Response samajh nahi aayi. Dobara koshish karein.", 'ai-message');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Connection Error: Internet connection check karein.", 'ai-message');
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            const msgId = 'msg-' + Date.now();
            messageDiv.id = msgId;
            chatContainer.appendChild(messageDiv);
            return msgId;
        }
        document.getElementById('userInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
